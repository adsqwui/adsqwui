name: render profile

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"   # every 6 hours: 00:17, 06:17, 12:17, 18:17 MSK
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/logo.txt", "assets/fonts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile"
            git push
          fi
